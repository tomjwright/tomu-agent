name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-extras
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Fail on any known vulnerability in a locked package
        run: uv export --frozen --all-extras --no-hashes --no-emit-project | uv run pip-audit --strict -r /dev/stdin
      - name: Fail on any licence outside this permissive list (GPL and AGPL are not on it)
        run: >-
          uv run pip-licenses --from=mixed --partial-match --with-system
          --allow-only "MIT;BSD;Apache;ISC;PSF;Python Software Foundation;MPL-2.0;Mozilla Public License 2.0;LGPL;GNU Lesser General Public License;Unlicense"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - name: Fail on any production package licence outside this permissive list
        run: >-
          npx --yes license-checker-rseidelsohn@4.4.2 --production --excludePrivatePackages --summary
          --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;BlueOak-1.0.0;CC0-1.0;CC-BY-4.0;MPL-2.0;LGPL-3.0-or-later;OFL-1.1"
