name: release

# Push a tag like v0.2.0 on a commit that is on main to publish a GitHub Release.
# Tomu runs from a checkout, so the release is the source archive of the tagged commit, released
# only if the release gate (every test, then the evals against the real model) is OPEN.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    # Holds ANTHROPIC_API_KEY. Add required reviewers here to approve each release before the
    # evals spend tokens.
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false # a release must not restore a cache a PR could have written
      - name: Fail unless the tagged commit is on main and the tag matches the version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(uvx --from toml-cli==0.7.0 toml get --toml-path pyproject.toml project.version)
          test "$GITHUB_REF_NAME" = "v${version}"
      - run: uv sync --frozen --all-extras
      - name: Run the release gate, which fails unless it is OPEN
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOMU_DB: ${{ runner.temp }}/gate.db
        run: uv run tomu-gate
      - name: Archive the tagged source and write SHA256SUMS
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="tomu-${GITHUB_REF_NAME}/" -o "dist/tomu-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_SHA"
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
      # Private repos need GitHub Enterprise Cloud for artifact attestations. Set the repository
      # variable ATTESTATIONS_ENABLED=true where it is available (or the repo is public).
      - name: Sign build provenance for the archive
        if: vars.ATTESTATIONS_ENABLED == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Publish the GitHub Release with the archive and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag could have been moved to another commit while the release waited for approval.
        run: |
          tagged=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq .sha)
          test "$tagged" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
