name: codeql

# Static security analysis of the Python code and the workflows themselves.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    # Private repos need GitHub Code Security for CodeQL. Set the repository variable
    # CODEQL_ENABLED=true where it is on (or the repo is public); elsewhere this job skips.
    if: vars.CODEQL_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read # private repos: CodeQL reads the workflow run to upload results
      contents: read
      security-events: write # upload CodeQL results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}
