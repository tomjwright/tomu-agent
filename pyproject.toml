[project]
name = "tomu"
version = "0.1.0"
description = "A local AI agent that shows every step it takes"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.7",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
tomu = "tomu.cli:main"
tomu-google = "tomu.google_auth:connect"
tomu-telegram = "tomu.telegram:main"
tomu-evals = "tomu.evals:main"
tomu-gate = "tomu.gate:main"

[project.optional-dependencies]
google = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "pip-audit>=2.9",
    "pip-licenses>=5",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
